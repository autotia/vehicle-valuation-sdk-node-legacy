name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions: {}

jobs:
  test:
    name: Node.js 22 and 11.15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check package
        run: npm run check:package

      - name: Test on Node.js 22
        run: node test/run.js

      - name: Test on Node.js 11.15
        run: docker run --rm -v "$PWD:/work" -w /work node:11.15.0-alpine node test/run.js
